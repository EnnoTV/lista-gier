<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Krypta Gier · Enno</title>
<meta property="og:title" content="Krypta Gier · Enno"><meta property="og:description" content="Ukończone, w trakcie i zaplanowane gry – z zakładkami i wyszukiwarką."><meta name="theme-color" content="#e01b24">
<!-- Lista gier dla widzow. Na ekranie: zakladki, szukajka, filtr PS/PC. W druku (PDF): wszystkie sekcje po kolei.
     Serwer robi z tego dane/lista_gier.html (dziala bez serwera, do wyslania na Discorda) i dane/lista_gier.pdf.
     Podglad na zywo: http://localhost:8766/LISTA.html -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0e;--card:#16161a;--row:#121216;--line:#2a2a31;--tx:#eeeef2;--mut:#9b9ba6;--dim:#6f6f7a;--ac:#e01b24;--ac2:#8f0b12;--gold:#f2c94c}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html{background:var(--bg)}
body{margin:0 auto;max-width:900px;padding:28px 22px 30px;background:var(--bg);color:var(--tx);font:13px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif}
.H{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.05em}
header{display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:3px solid var(--ac)}
header .logo{height:60px;width:auto;display:block}
header .sep{width:6px;height:52px;background:var(--ac);transform:skewX(-14deg);flex:none}
header h1{margin:0;font-size:58px;line-height:.85;color:#fff;white-space:nowrap;padding-top:4px;text-transform:uppercase}header h1 b{color:var(--ac);font-weight:400}
header .sub{align-self:flex-end;white-space:nowrap}
header .sub{margin-left:auto;text-align:right;color:var(--mut);font-size:12px;line-height:1.5}header .sub strong{color:#fff;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0 6px}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.st .n{font-size:32px;line-height:1;color:#fff}.st .l{color:var(--mut);font-size:11px;margin-top:3px}
.st.gold .n{color:var(--gold)}
.pl{display:inline-block;font-size:10px;font-weight:700;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.pl.ps{color:#8fb4ff;border-color:#2b3a5c}.pl.pc{color:#9be3b0;border-color:#24452f}
.full{color:var(--gold);font-weight:700}.pc100{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;color:#111;background:var(--gold);border-radius:4px;padding:0 5px}
.bar{display:inline-block;width:46px;height:5px;border-radius:3px;background:#26262d;margin-left:7px;vertical-align:middle;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.pti{height:17px;width:auto;margin-left:7px;vertical-align:-3px}
.none{color:var(--dim);padding:6px 10px}
footer{margin-top:24px;padding-top:10px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;display:flex;justify-content:space-between;gap:10px}
.msg{padding:18px 0;color:var(--tx)}.msg small{display:block;color:var(--mut);margin-top:6px}

/* ---- ekran: zakladki + szukajka ---- */
.tabs{display:flex;flex-wrap:wrap;gap:6px 4px;margin:18px 0 10px;padding-left:6px}
.tab{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;color:var(--mut);transform:skewX(-14deg)}
.tab{background:var(--card);border:1px solid var(--line)}
.tab>span{display:flex;align-items:center;gap:8px;padding:6px 14px 5px;transform:skewX(14deg)}
.tab b{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:21px;letter-spacing:.05em;line-height:1;color:#fff}
.tab i{font-style:normal;font-size:11px;font-weight:700;color:var(--mut);background:#0c0c0e;border-radius:9px;padding:1px 7px;min-width:22px;text-align:center}
.tab:hover{border-color:#4a1418}
.tab.on{background:linear-gradient(180deg,var(--ac),var(--ac2));border-color:var(--ac)}.tab.on i{background:rgba(0,0,0,.35);color:#fff}
.tab.g.on{background:linear-gradient(180deg,#f2c94c,#b8901f);border-color:#f2c94c}.tab.g.on b,.tab.g.on i{color:#111}.tab.g.on i{background:rgba(255,255,255,.35)}
.tab.zero{opacity:.45}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.srch{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:0 10px;height:38px}
.srch:focus-within{border-color:var(--ac)}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:14px}
.srch input::placeholder{color:var(--dim)}
.srch button{border:0;background:none;color:var(--mut);font-size:16px;cursor:pointer;padding:0 2px;display:none}.srch.has button{display:block}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;height:38px}
.seg button{border:0;background:none;color:var(--mut);font:600 12px "Segoe UI",system-ui,sans-serif;padding:0 13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:#2a0c0f;color:#fff;box-shadow:inset 0 -2px 0 var(--ac)}
select.so{height:38px;background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--tx);font:inherit;padding:0 10px;cursor:pointer}
.rows{display:flex;flex-direction:column;gap:3px}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0 2px;box-shadow:0 10px 14px -10px rgba(0,0,0,.8)}
.hd,.r{display:grid;grid-template-columns:30px minmax(0,1fr) 62px 118px 220px;align-items:center;gap:0 14px;padding:0 14px 0 10px}
.rows.wst .hd,.rows.wst .r{grid-template-columns:30px minmax(0,1fr) 108px 62px 118px 220px}
.hd{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);padding-top:6px;padding-bottom:6px;border-left:4px solid transparent}
.hd .t,.hd .a,.r .t{text-align:right;white-space:nowrap}
.r{background:var(--row);border:1px solid var(--line);border-left:4px solid #44444d;border-radius:8px;min-height:50px;padding-top:9px;padding-bottom:9px;font-size:14px}
.r.done{border-left-color:#2fbf62}.r.play{border-left-color:var(--ac)}.r.plan{border-left-color:#5b5b66}
.r:hover{background:#1a1a20;border-color:#3a3a44}
.r .i{color:var(--dim);text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.r .nm{font-weight:600;font-size:15.5px;line-height:1.3;color:#fff;word-break:break-word}
.r .t{color:#fff;font-variant-numeric:tabular-nums}
.r .no{color:#4a4a54}
.r .a{display:flex;align-items:center;justify-content:flex-end;gap:8px;white-space:nowrap;color:var(--tx);font-variant-numeric:tabular-nums}
.r .a .bar{width:70px;height:6px;margin:0}
.r .a .pct{min-width:34px;text-align:right;color:var(--mut);font-size:12px}
.r .a .pc100{margin-left:0}.r .a .pti{margin-left:0;height:19px}
.r .pl{font-size:11px;padding:1px 6px}
.r .no,.r .a.no{color:#4a4a54}
.r mark{background:rgba(224,27,36,.35);color:#fff;border-radius:2px}
.sp{display:inline-block;font-size:11.5px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:1px 9px;white-space:nowrap}
.sp.done{color:#9be3b0;border-color:#24452f}.sp.play{color:#ffb3b6;border-color:#5a1a1e}.sp.plan{color:var(--mut)}
.empty{padding:26px 10px;text-align:center;color:var(--mut);background:var(--row);border:1px dashed var(--line);border-radius:8px}
.empty a{color:#fff;cursor:pointer;text-decoration:underline}

/* ---- druk (PDF): wszystkie sekcje, bez przyciskow ---- */
#druk{display:none}
#druk section{margin-top:20px}
#druk h2{margin:0 0 7px;font-size:25px;color:#fff;display:flex;align-items:center;gap:9px;break-after:avoid;page-break-after:avoid}
#druk h2::before{content:"";width:5px;height:19px;background:var(--ac);transform:skewX(-14deg)}
#druk h2 em{font-style:normal;font-family:"Segoe UI",system-ui,sans-serif;font-size:12px;letter-spacing:0;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1px 9px}
table{width:100%;border-collapse:separate;border-spacing:0 3px;table-layout:fixed}
col.c1{width:38px}col.c3{width:84px}col.c4{width:112px}col.c5{width:172px}
th{text-align:left;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:2px 10px}
td{background:var(--row);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 10px;vertical-align:middle}
td:first-child{border-left:1px solid var(--line);border-radius:7px 0 0 7px;color:var(--dim);width:34px;text-align:right;font-size:11.5px}
td:last-child{border-right:1px solid var(--line);border-radius:0 7px 7px 0}
tr{break-inside:avoid;page-break-inside:avoid}
td.nm{font-weight:600;color:#fff;word-break:break-word}
td.t,td.a,th.t,th.a{text-align:right;white-space:nowrap}td.t{color:var(--tx)}td.a{color:var(--mut)}

@media(max-width:640px){
 body{padding:18px 12px 24px}
 .stats{grid-template-columns:repeat(3,1fr)}header h1{font-size:34px}header .logo{height:34px}header .sep{height:30px;width:4px}header{gap:10px}header .sub{font-size:10.5px}
 .st .n{font-size:26px}
 .tab>span{padding:5px 10px 4px}.tab b{font-size:18px}
 .hd{display:none}
 .r,.rows.wst .r{display:flex;flex-wrap:wrap;align-items:center;gap:7px 10px;padding:10px 12px 10px 10px}
 .r .i{display:none}.r .nm{flex:1 1 100%;font-size:15px}
 .r .t{text-align:left}.r .a{margin-left:auto}.r .a .bar{width:40px}.r .a .pct{display:none}
}
@page{size:A4;margin:11mm 0;background:#0c0c0e}
@media print{body{max-width:none;padding:3mm 13mm 0}#app{display:none!important}#druk{display:block!important}}

const ST=[['done','Ukończone'],['play','W trakcie'],['plan','Zaplanowane']];
const STN={done:'ukończona',play:'w trakcie',plan:'zaplanowana'};
const TABS=[['all','Wszystkie'],['done','Ukończone'],['play','W trakcie'],['plan','Zaplanowane'],['full','100%']];
const hm=m=>{m=Math.max(0,+m||0);const h=Math.floor(m/60),r=m%60;return h?(h+' h'+(r?' '+r+' min':'')):(r?r+' min':'—')};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const dt=t=>{const d=new Date(t||Date.now()),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+', '+p(d.getHours())+':'+p(d.getMinutes())};
const gier=n=>n===1?'1 gra':n+(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?' gry':' gier');
const isFull=g=>!!g.platyna||(+g.am>0&&+g.a>=+g.am);
const stOf=g=>({done:1,play:1,plan:1}[g.st]?g.st:'play');
const byName=(a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pl',{numeric:true,sensitivity:'base'});
// szukanie bez polskich znakow i wielkosci liter
const fold=s=>String(s||'').toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[̀-ͯ]/g,'');
const sget=k=>{try{return localStorage.getItem('lista_'+k)}catch(e){return null}},sset=(k,v)=>{try{localStorage.setItem('lista_'+k,v)}catch(e){}};

function ach(g,box){
 const a=+g.a||0,am=+g.am||0;
 if(am>0){if(a>=am){box.append(el('span','full',a+'/'+am),el('span','pc100','100%'))}else{box.append(a+'/'+am);const b=el('span','bar'),f=el('i');f.style.width=Math.round(a/am*100)+'%';b.append(f);box.append(b)}}else if(!g.platyna)box.textContent='—';
 if(g.platyna){const im=el('img','pti');im.src=g.plat==='pc'?STEAM100:PLAT;im.alt=im.title=g.plat==='pc'?'komplet Steam':'platyna';box.append(im)}}
function plB(g){const pc=g.plat==='pc';return el('span','pl '+(pc?'pc':'ps'),pc?'PC':'PS')}

let G=[],V={tab:'all',q:'',pf:'all',so:'az'};
{const h=(location.hash||'').replace('#','');if(TABS.some(t=>t[0]===h))V.tab=h;else{const s=sget('tab');if(TABS.some(t=>t[0]===s))V.tab=s}
 const p=sget('pf');if(p==='ps'||p==='pc')V.pf=p;const o=sget('so');if(['az','czas','osi'].includes(o))V.so=o}

function head(D){
 if(/^#[0-9a-f]{6}$/i.test(D.ac||''))document.documentElement.style.setProperty('--ac',D.ac);
 const ch=String(D.kanal||'').trim().replace(/^#/,'');
 const sub=$('sub');sub.innerHTML='';if(ch){sub.append(el('strong',null,'twitch.tv/'+ch),el('br'))}sub.append('stan na '+dt(D.at));
 $('ft1').textContent='Wygenerowano '+dt(D.at)+' · gier na liście: '+G.length;
 const cnt=k=>G.filter(g=>stOf(g)===k).length,tot=G.reduce((s,g)=>s+Math.max(0,+g.min||0),0),plat=G.filter(isFull).length;
 const sb=$('stats');sb.innerHTML='';
 [[cnt('done'),'ukończone'],[cnt('play'),'w trakcie'],[cnt('plan'),'zaplanowane'],[Math.round(tot/60),'godzin łącznie'],[plat,'gier na 100% 🏆','gold']].forEach(([n,l,c])=>{const d=el('div','st'+(c?' '+c:''));d.append(el('div','n H',n),el('div','l',l));sb.append(d)})}

let ui=null;
function buildUi(){
 const app=$('app');app.innerHTML='';
 const tabs=el('div','tabs');tabs.setAttribute('role','tablist');
 const tb={};TABS.forEach(([k,n])=>{const b=el('button','tab'+(k==='full'?' g':''));b.type='button';const s=el('span');s.append(el('b',null,n),el('i',null,'0'));b.append(s);b.onclick=()=>{V.tab=k;sset('tab',k);try{history.replaceState(null,'','#'+k)}catch(e){}draw()};tb[k]=b;tabs.append(b)});
 const bar=el('div','bar2'),sr=el('label','srch'),inp=el('input'),x=el('button',null,'✕');
 inp.type='text';inp.setAttribute('enterkeyhint','search');inp.placeholder='Szukaj gry…';inp.autocomplete='off';inp.spellcheck=false;x.type='button';x.title='Wyczyść';
 sr.append(el('span',null,'🔎'),inp,x);
 inp.oninput=()=>{V.q=inp.value;draw()};x.onclick=()=>{inp.value='';V.q='';draw();inp.focus()};
 const seg=el('div','seg'),pb={};[['all','PS + PC'],['ps','PS'],['pc','PC']].forEach(([k,n])=>{const b=el('button',null,n);b.type='button';b.onclick=()=>{V.pf=k;sset('pf',k);draw()};pb[k]=b;seg.append(b)});
 const so=el('select','so');[['az','A–Z'],['czas','Najdłużej grane'],['osi','Postęp osiągnięć']].forEach(([k,n])=>{const o=el('option',null,n);o.value=k;so.append(o)});so.value=V.so;so.onchange=()=>{V.so=so.value;sset('so',V.so);draw()};
 bar.append(sr,seg,so);
 const list=el('div','rows'),tools=el('div','tools');tools.append(tabs,bar);
 app.append(tools,list);
 ui={tb,pb,inp,sr,list};
}
document.addEventListener('keydown',e=>{
 if(!ui)return;const inInp=document.activeElement===ui.inp;
 if(e.key==='/'&&!inInp){e.preventDefault();ui.inp.focus();ui.inp.select()}
 else if(e.key==='Escape'&&inInp){ui.inp.value='';V.q='';draw();ui.inp.blur()}
 else if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&!inInp&&document.activeElement.tagName!=='SELECT'){const i=TABS.findIndex(t=>t[0]===V.tab),n=(i+(e.key==='ArrowRight'?1:TABS.length-1))%TABS.length;V.tab=TABS[n][0];sset('tab',V.tab);draw()}});
function hl(name,q){
 const f=el('span');if(!q){f.textContent=name;return f}
 // zaznacz trafienie w oryginalnej nazwie (fold zachowuje dlugosc dla polskich liter)
 const fn=fold(name);let i=fn.indexOf(q);if(i<0||fn.length!==name.length){f.textContent=name;return f}
 let p=0;while(i>=0){f.append(name.slice(p,i));f.append(el('mark',null,name.slice(i,i+q.length)));p=i+q.length;i=fn.indexOf(q,p)}f.append(name.slice(p));return f}
function draw(){
 if(!ui)return;
 const q=fold(V.q.trim());ui.sr.classList.toggle('has',!!V.q);
 const base=G.filter(g=>(V.pf==='all'||(V.pf==='pc'?g.plat==='pc':g.plat!=='pc'))&&(!q||fold(g.name).includes(q)));
 const inTab=(g,k)=>k==='all'||(k==='full'?isFull(g):stOf(g)===k);
 TABS.forEach(([k])=>{const n=base.filter(g=>inTab(g,k)).length,b=ui.tb[k];b.querySelector('i').textContent=n;b.classList.toggle('on',V.tab===k);b.classList.toggle('zero',!n&&V.tab!==k);b.setAttribute('aria-selected',V.tab===k)});
 Object.keys(ui.pb).forEach(k=>ui.pb[k].classList.toggle('on',V.pf===k));
 let l=base.filter(g=>inTab(g,V.tab));
 const pr=g=>+g.am>0?(+g.a||0)/+g.am:(g.platyna?1:-1);
 l.sort(V.so==='czas'?(a,b)=>(+b.min||0)-(+a.min||0)||byName(a,b):V.so==='osi'?(a,b)=>pr(b)-pr(a)||(+b.am||0)-(+a.am||0)||byName(a,b):byName);
 const box=ui.list;box.innerHTML='';
 if(!l.length){
  const e=el('div','empty');
  if(!G.length)e.textContent='Lista jest pusta.';
  else if(q||V.pf!=='all'){
   const other=TABS.filter(([k])=>k!==V.tab&&k!=='all'&&base.some(g=>inTab(g,k)));
   e.append(q?'Nic nie pasuje do „'+V.q.trim()+'” w tej zakładce.':'Brak gier na tej platformie w tej zakładce.');
   if(other.length&&V.tab!=='all'){e.append(el('br'),'Jest w: ');other.forEach(([k,n],i)=>{if(i)e.append(', ');const a=el('a',null,n);a.onclick=()=>{V.tab=k;sset('tab',k);draw()};e.append(a)})}
  }else e.textContent='Pusto.';
  box.append(e);return}
 const showSt=V.tab==='all'||V.tab==='full';box.classList.toggle('wst',showSt);
 const hd=el('div','hd');[['#',''],['Gra',''],...(showSt?[['Status','']]:[]),['Platforma',''],['Czas gry','t'],['Osiągnięcia','a']].forEach(([x,c])=>hd.append(el('div',c,x)));box.append(hd);
 const fr=document.createDocumentFragment();
 l.forEach((g,i)=>{const s=stOf(g),r=el('div','r '+s),nm=el('div','nm');nm.append(hl(String(g.name||'(bez nazwy)'),q));
  r.append(el('div','i',i+1),nm);if(showSt){const c=el('div','s');c.append(el('span','sp '+s,STN[s]));r.append(c)}
  const p=el('div','p');p.append(plB(g));const tm=+g.min>0;
  r.append(p,el('div','t'+(tm?'':' no'),hm(g.min)),achS(g));fr.append(r)});
 box.append(fr)}
// osiagniecia na ekranie: licznik + pasek + procent
function achS(g){
 const a=+g.a||0,am=+g.am||0,box=el('div','a');
 if(am>0){if(a>=am){box.append(el('span','full',a+'/'+am),el('span','pc100','100%'))}
  else{const pc=Math.round(a/am*100);box.append(el('span',null,a+'/'+am));const b=el('span','bar'),f=el('i');f.style.width=pc+'%';b.append(f);box.append(b,el('span','pct',pc+'%'))}}
 else if(!g.platyna){box.classList.add('no');box.textContent='—'}
 if(g.platyna){const im=el('img','pti');im.src=g.plat==='pc'?STEAM100:PLAT;im.alt=im.title=g.plat==='pc'?'komplet Steam':'platyna';box.append(im)}
 return box}

/* ---------- druk (PDF): jak dawniej, wszystkie sekcje ---------- */
function druk(){
 const box=$('druk');box.innerHTML='';
 ST.forEach(([k,n])=>{
  const l=G.filter(g=>stOf(g)===k).sort(byName);
  const s=el('section'),h=el('h2','H',n);h.append(el('em',null,gier(l.length)));s.append(h);
  if(!l.length){s.append(el('div','none','pusto'));box.append(s);return}
  const t=el('table'),cg=el('colgroup');['c1','c2','c3','c4','c5'].forEach(c=>cg.append(el('col',c)));t.append(cg);const th=el('thead'),hr=el('tr');[['#',''],['Gra',''],['Platforma',''],['Czas gry','t'],['Osiągnięcia','a']].forEach(([x,c])=>hr.append(el('th',c,x)));th.append(hr);t.append(th);
  const tb=el('tbody');
  l.forEach((g,i)=>{const r=el('tr');r.append(el('td',null,i+1),el('td','nm',g.name||'(bez nazwy)'));const p=el('td');p.append(plB(g));r.append(p,el('td','t',hm(g.min)));const ta=el('td','a');ach(g,ta);r.append(ta);tb.append(r)});
  t.append(tb);s.append(t);box.append(s)})}

let sig='';
function render(D){
 const s=JSON.stringify([D.gry,D.ac,D.kanal]);if(s===sig)return;sig=s;
 G=(Array.isArray(D.gry)?D.gry:[]).filter(g=>g&&typeof g==='object');
 head(D);if(!ui)buildUi();draw();druk()}
function fail(){$('app').innerHTML='';const m=el('div','msg');m.append('Brak danych – serwer ZGONY nie odpowiada.');const s=el('small',null,'Uruchom START.bat i otwórz http://localhost:8766/LISTA.html');m.append(s);$('app').append(m)}

if(window.LISTA)render(window.LISTA);
else{
 // podglad na zywo z serwera (dziala tez, gdy plik otwarto prosto z folderu)
 const B=location.port=='8766'?'':'http://localhost:8766';let ok=false;
 const load=()=>fetch(B+'/stan',{cache:'no-store'}).then(r=>r.json()).then(s=>{ok=true;render({gry:s.gry,ac:(s.tab&&s.tab.ac)||(s.cfg&&s.cfg.ac),kanal:s.cfg&&s.cfg.ch,at:Date.now()})}).catch(()=>{if(!ok)fail()});
 load();setInterval(load,3000);
}
})();
